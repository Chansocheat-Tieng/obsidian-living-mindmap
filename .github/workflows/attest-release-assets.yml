name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --pattern main.js --pattern styles.css --dir release-assets

      - name: Verify assets match tagged source
        run: |
          cmp main.js release-assets/main.js
          cmp styles.css release-assets/styles.css

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/main.js
            release-assets/styles.css
